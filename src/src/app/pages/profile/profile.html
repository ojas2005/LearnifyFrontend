<div class="admin-wrap">
  <div style="margin-bottom: 40px; animation: slide-up 0.5s ease both;">
    <h1 class="section-title">Account Settings ⚙️</h1>
    <p class="section-sub">Manage your profile information and security preferences</p>
  </div>

  <div class="profile-grid">
    <div class="clay-card profile-card">
      <div class="profile-header">
        <div class="avatar-wrap">
          <img *ngIf="user?.profilePictureUrl" [src]="user.profilePictureUrl" class="avatar-img" alt="Profile" />
          <div *ngIf="!user?.profilePictureUrl" class="avatar" [style.background]="'#DCFCE7'">
            {{user?.displayName?.charAt(0) || 'U'}}
          </div>
        </div>
        <div>
          <h2 class="user-title">{{user?.displayName}}</h2>
          <p class="user-email">{{user?.email}}</p>
          <div class="clay-badge" style="margin-top: 8px; background: #DCFCE7; color: #166534; border-color: #BBF7D0;">
            {{user?.role}}
          </div>
        </div>
      </div>

      <form (submit)="updateProfile(); $event.preventDefault()" style="margin-top: 32px;">
        <div class="form-group">
          <label class="form-label">Display Name</label>
          <input class="clay-input" [(ngModel)]="form.displayName" name="displayName" placeholder="Enter your name" />
        </div>
        <div class="form-group">
          <label class="form-label">Profile Picture URL</label>
          <input class="clay-input" [(ngModel)]="form.profilePictureUrl" name="pfp" placeholder="https://..." />
        </div>
        <button class="clay-btn" style="width: 100%; margin-top: 12px;" [disabled]="loading">
          {{loading ? 'Saving...' : 'Save Profile Changes ✨'}}
        </button>
      </form>
    </div>

    <div class="clay-card profile-card" style="animation-delay: 0.1s;">
      <h2 class="section-title" style="font-size: 20px; margin-bottom: 24px;">Security & Password 🔐</h2>
      <form (submit)="changePassword(); $event.preventDefault()">
        <div class="form-group">
          <label class="form-label">Current Password</label>
          <input type="password" class="clay-input" [(ngModel)]="passForm.currentPassword" name="curr" placeholder="••••••••" />
        </div>
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input type="password" class="clay-input" [(ngModel)]="passForm.newPassword" name="new" placeholder="••••••••" />
        </div>
        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <input type="password" class="clay-input" [(ngModel)]="passForm.confirmPassword" name="conf" placeholder="••••••••" />
        </div>
        <button class="clay-btn sm outline" style="width: 100%; margin-top: 12px;" [disabled]="loading">
          Update Password
        </button>
      </form>

      <div style="margin-top: 40px; padding-top: 24px; border-top: 2.5px solid #BBF7D0;">
        <p style="font-size: 13px; color: #166534; font-weight: 600;">
          Account ID: #{{user?.id}}<br>
          Member since: {{user?.registeredOn | date:'mediumDate'}}
        </p>
      </div>
    </div>
  </div>
</div>
